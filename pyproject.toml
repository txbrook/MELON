[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melon-pkg"
version = "0.1.0"
description = "MELON: metric learning for multi-omic spatial representation learning"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "MELON contributors" }
]
dependencies = [
  "einops>=0.6",
  "h5py>=3.8",
  "igraph>=1.0",
  "leidenalg>=0.11",
  "networkx>=3.0",
  "numpy>=1.23",
  "pandas>=1.5",
  "python-louvain>=0.16",
  "pytorch-lightning>=2.0",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "torch>=2.1",
]

[project.optional-dependencies]
tutorials = [
  "matplotlib>=3.6",
  "nbformat>=5",
  "ipython>=8",
  "scanpy>=1.10",
]
h5ad = [
  "anndata>=0.10",
  "scanpy>=1.10",
]
dev = [
  "build>=1.2",
  "ruff>=0.4",
  "twine>=5.0",
]

[project.scripts]
melon-run = "melon_pkg.cli_run:main"
melon-cluster = "melon_pkg.cli_cluster:main"

[tool.setuptools]
include-package-data = false
packages = [
  "melon_pkg",
  "melon_pkg.losses",
  "melon_pkg.models",
  "melon_pkg.pl_modules",
]

[tool.setuptools.package-dir]
melon_pkg = "MELON"
"melon_pkg.losses" = "MELON/losses"
"melon_pkg.models" = "MELON/models"
"melon_pkg.pl_modules" = "MELON/pl_modules"
